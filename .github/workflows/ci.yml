name: CI

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install 'poetry==2.1.4'
          poetry install --with dev

      - name: Run unit tests (services/gateway)
        run: poetry run python -m unittest discover -s services/gateway/tests -t .

      - name: Run load/chaos scenario tests (M6)
        run: poetry run python -m unittest discover -s loadtests -t .

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t gateway-api:ci .

      - name: Run container
        run: |
          docker run -d --name gateway-api-ci -p 8080:8080 gateway-api:ci

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/healthz; then
              echo "gateway is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "gateway did not become healthy in time"
          exit 1

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs gateway-api-ci

      - name: Stop container
        if: always()
        run: docker rm -f gateway-api-ci

  deploy-dev:
    name: Deploy to dev
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-ecs
        with:
          aws-region: us-east-1
          deploy-role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_DEV }}
          ecr-repository: gateway-dev
          ecs-cluster: gateway-dev-cluster
          ecs-service: gateway-dev-service
          task-definition-family: gateway-dev

  deploy-prod:
    name: Deploy to prod
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Gated by the "prod" GitHub Environment's required reviewers (repo
    # Settings -> Environments -> prod) -- configure that separately;
    # Actions has no YAML-level equivalent of a manual approval gate.
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-ecs
        with:
          aws-region: us-east-1
          deploy-role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          ecr-repository: gateway-prod
          ecs-cluster: gateway-prod-cluster
          ecs-service: gateway-prod-service
          task-definition-family: gateway-prod
