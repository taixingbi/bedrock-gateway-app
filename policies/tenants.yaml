# ============================================================
# COPY -- not the source of truth. Canonical copy lives in
# github.com/taixingbi/bedrock-gateway-policies (environments/dev/).
# Sync by running scripts/sync-policies.sh against a checkout of
# that repo. This copy exists only so `docker build` here keeps
# working during the app/infra/policies repo split -- once the
# gateway has a working S3/DynamoDB-backed PolicyStore, this
# directory and the COPY step in Dockerfile go away entirely.
# ============================================================
# Tenant policy config (M2). Stands in for the DynamoDB-backed control
# plane in plan section 8 -- see services/gateway/policy/store.py.
#
# Loaded once at startup by FilePolicyStore. To change a tenant's state
# at runtime without restarting the gateway, use the admin API instead of
# editing this file:
#
#   PUT /v1/admin/tenants/{tenant_id}/state   {"state": "SUSPENDED"}
#
# (requires a token with the ADMIN_REQUIRED_ROLE role, default
# platform_admin) -- that takes effect immediately via push invalidation,
# whereas a file edit only takes effect on the next process restart.

tenants:
  finance:
    state: ACTIVE
    models:
      - us.amazon.nova-micro-v1:0
      # more models coming later -- add their inference profile IDs here
      # once confirmed accessible (aws bedrock list-inference-profiles)
    rpm_limit: 300
    guardrail_policy: finance-v1
    route_set: finance-chat-v1
    slo:
      p95_latency_ms: 3000
    policy_epoch: 1
    monthly_budget: 10000 # M8 FinOps hard limit, USD/month

  search:
    state: ACTIVE
    models:
      - us.amazon.nova-micro-v1:0
      # more models coming later -- add their inference profile IDs here
      # once confirmed accessible (aws bedrock list-inference-profiles)
    rpm_limit: 120
    guardrail_policy: standard-v1
    route_set: search-chat-v1
    slo:
      p95_latency_ms: 5000
    policy_epoch: 1

  sandbox:
    state: ACTIVE
    models: []   # no restriction beyond the gateway default model
    rpm_limit: 30
    guardrail_policy: standard-v1
    policy_epoch: 1

  # Callers authenticated via the AWS_IAM/SigV4 path (see
  # policies/iam_tenants.yaml, which maps an IAM principal ARN to this
  # tenant_id) rather than a JWT.
  team-a:
    state: ACTIVE
    models: []   # no restriction beyond the gateway default model
    rpm_limit: 60
    guardrail_policy: standard-v1
    policy_epoch: 1
    # Deliberately tiny -- M8 smoke-test budget, small enough that a
    # single real chat/job call exhausts it, so BUDGET_EXCEEDED can be
    # demonstrated live with one extra curl rather than thousands.
    monthly_budget: 0.000002
