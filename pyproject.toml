[tool.poetry]
name = "bedrock-gateway-platform"
version = "0.1.0"
description = "Multi-tenant enterprise LLM gateway on AWS Bedrock"
authors = []
readme = "README.md"
packages = [{ include = "services" }, { include = "loadtests" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
starlette = ">=0.49,<1.0"
pydantic = ">=2.0,<3.0"
uvicorn = ">=0.38,<1.0"
boto3 = ">=1.34,<2.0"
pyjwt = { version = ">=2.8,<3.0", extras = ["crypto"] }
pyyaml = ">=6.0,<7.0"
opentelemetry-api = ">=1.20,<2.0"
opentelemetry-sdk = ">=1.20,<2.0"

[tool.poetry.group.dev.dependencies]
httpx = ">=0.28,<1.0"
pytest = ">=7.4,<9.0"
locust = ">=2.20,<3.0"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
